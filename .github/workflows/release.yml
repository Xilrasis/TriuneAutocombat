name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v1.6)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Release Notes & Instructions
        run: |
          python3 - << 'EOF'
          with open('TAC/CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Extract latest release entry from top up to first '---' section separator
          sections = content.split('\n---\n')
          latest_entry = sections[0].strip()

          # Strip '# Triune AutoCombat Change Log' title line if present
          lines = latest_entry.split('\n')
          if lines and lines[0].startswith('# '):
              lines = lines[1:]
          latest_notes = '\n'.join(lines).strip()

          instructions = '''---

          ## 📦 Installation & Updating Instructions

          ### 🆕 New Installation
          1. Go here and grab the latest macroquest release https://github.com/macroquest/macroquest/releases and extract under your user folder.
          2. Download TriuneAutocombat.zip below and extract its `TAC` folder directly into your MacroQuest install's `lua` folder (giving you `<MacroQuest Root>/lua/TAC/`).
          3. Start **`MacroQuest.exe`** before launching EverQuest.

          ### 🔄 Updating an Existing Install
          - Download **`TriuneAutocombat.zip`** from the Assets below.
          - Extract and overwrite the `TAC` folder in your existing MacroQuest `lua` directory.
          - *Note: Your personal settings and saved loadouts in `triune_loadout.lua` are preserved and will never be overwritten.*
          '''

          # Strip leading indentation from instructions block
          cleaned_lines = []
          for line in instructions.split('\n'):
              if line.startswith('          '):
                  cleaned_lines.append(line[10:])
              else:
                  cleaned_lines.append(line)
          instructions_clean = '\n'.join(cleaned_lines)

          full_body = latest_notes + '\n\n' + instructions_clean.strip() + '\n'

          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(full_body)

          print("Generated RELEASE_NOTES.md successfully")
          EOF

      - name: Package Release Archive
        run: |
          # TAC/ is already laid out exactly as it should be dropped into a
          # MacroQuest install's lua/ folder. TAC/tests and TAC/util are
          # dev-only and excluded from the shipped zip.
          git archive --format=zip -o TriuneAutocombat.zip HEAD -- TAC ':(exclude)TAC/tests' ':(exclude)TAC/util'

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TriuneAutocombat.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
